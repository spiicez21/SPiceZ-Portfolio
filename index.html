<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Favicon/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPiceZ | Yugabharathi J - Portfolio</title>

  <!-- SEO -->
  <meta name="description"
    content="Portfolio of Yugabharathi J (SPiceZ) - Full-Stack Developer & Designer specializing in React, Node.js, and creative web experiences." />
  <meta name="keywords"
    content="Yugabharathi J, SPiceZ, Portfolio, Full-Stack Developer, Web Designer, React Developer, Creative Developer" />
  <meta name="author" content="Yugabharathi J" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yugabharathi21.netlify.app/" />
  <meta property="og:title" content="SPiceZ | Yugabharathi J - Portfolio" />
  <meta property="og:description" content="Immersive portfolio showcasing creative development and design projects." />
  <meta property="og:image" content="https://yugabharathi21.netlify.app/Picture/Profile-Portrait-Main.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://yugabharathi21.netlify.app/" />
  <meta property="twitter:title" content="SPiceZ | Yugabharathi J - Portfolio" />
  <meta property="twitter:description"
    content="Immersive portfolio showcasing creative development and design projects." />
  <meta property="twitter:image" content="https://yugabharathi21.netlify.app/Picture/Profile-Portrait-Main.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Content images are served from Cloudinary; open the connection early. -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>

  <!-- Self-hosted fonts used above the fold: fetch in parallel with the CSS
       instead of waiting for the stylesheet to be parsed first. -->
  <link rel="preload" as="font" type="font/woff2" href="/webfonts/ClashDIsplay/ClashDisplay-Regular.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/webfonts/Stardom/Stardom-Regular.woff2" crossorigin>
  <link rel="preload" as="image" href="/Picture/normal-main.png" fetchpriority="high">

  <!-- JetBrains Mono is decorative and used in two components. Load it without
       blocking first render. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
